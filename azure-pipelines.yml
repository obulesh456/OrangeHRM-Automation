trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  MAVEN_CACHE_FOLDER: $(Pipeline.Workspace)/.m2/repository

steps:
  - checkout: self

  - task: Cache@2
    displayName: Cache Maven dependencies
    inputs:
      key: 'maven | "$(Agent.OS)" | pom.xml'
      restoreKeys: |
        maven | "$(Agent.OS)"
      path: $(MAVEN_CACHE_FOLDER)

  - task: JavaToolInstaller@0
    displayName: Use Java 11
    inputs:
      versionSpec: '11'
      jdkArchitectureOption: x64
      jdkSourceOption: PreInstalled

  - task: Maven@4
    displayName: Build and run the full TestNG suite
    inputs:
      mavenPomFile: pom.xml
      goals: clean verify
      options: '-Dbrowser=chrome -Dheadless=true'
      publishJUnitResults: false
      javaHomeOption: JDKVersion
      jdkVersionOption: '1.11'
      mavenVersionOption: Default
    env:
      MAVEN_OPTS: '-Dmaven.repo.local=$(MAVEN_CACHE_FOLDER)'

  - task: PublishTestResults@2
    displayName: Publish TestNG results
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: '**/surefire-reports/TEST-*.xml'
      mergeTestResults: true
      failTaskOnFailedTests: true
      testRunTitle: OrangeHRM Selenium tests

  - task: CopyFiles@2
    displayName: Collect test reports and diagnostics
    condition: succeededOrFailed()
    inputs:
      SourceFolder: $(System.DefaultWorkingDirectory)
      Contents: |
        reports/**
        screenshots/**
        logs/**
        target/surefire-reports/**
      TargetFolder: $(Build.ArtifactStagingDirectory)/test-results

  - task: PublishPipelineArtifact@1
    displayName: Publish test reports and diagnostics
    condition: succeededOrFailed()
    inputs:
      targetPath: $(Build.ArtifactStagingDirectory)/test-results
      artifact: test-results
      publishLocation: pipeline
